<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile - Natally</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&amp;family=JetBrains+Mono:wght@500&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#120c1c",
            panel: "#1a1226",
            elevated: "#2a1d3d",
            hairline: "#3a2d50",
            cream: "#f1e8d8",
            muted: "#a698b5",
            gold: "#c9a24a",
            goldLight: "#f2ca50",
            deepGround: "#0b0712",
            coral: "#f2a38c",
            periwinkle: "#9fb4ff",
            violet: "#b9a0e8"
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            lg: "1rem",
            xl: "1.5rem",
            full: "9999px"
          },
          fontFamily: {
            fraunces: ["Fraunces", "serif"],
            cinzel: ["Cinzel", "serif"],
            body: ["Nunito Sans", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-canvas text-cream font-body antialiased min-h-screen flex flex-col justify-between selection:bg-elevated selection:text-goldLight">
<main class="w-full max-w-md mx-auto px-5 pt-6 pb-20 flex flex-col space-y-5">
<!-- 1. Header row -->
<header class="flex items-center justify-between min-h-[44px]">
<h1 class="font-fraunces text-[28px] text-cream leading-none tracking-tight">Profile</h1>
<button class="font-cinzel text-xs tracking-widest text-cream uppercase min-h-[44px] px-3 py-2 flex items-center justify-center hover:text-gold active:scale-95 transition-transform duration-150 focus:outline-none" id="profile-close-button" type="button">
        CLOSE
      </button>
</header>
<!-- 2. Identity card -->
<section class="bg-panel border border-hairline rounded-[16px] p-5 flex flex-col space-y-1">
<span class="font-fraunces text-[22px] text-cream leading-tight">[Name]</span>
<span class="font-mono text-[13px] text-muted tracking-tight">[email]</span>
</section>
<!-- 3. Balance card -->
<section class="bg-panel border border-hairline rounded-[16px] p-5 flex items-center justify-between" id="profile-balance-card">
<div class="flex flex-col space-y-1">
<span class="font-cinzel text-[11px] font-bold text-gold tracking-widest uppercase">BALANCE</span>
<span class="font-fraunces text-[40px] text-goldLight leading-none tracking-tight">79 Cr</span>
</div>
<button class="h-[44px] px-5 bg-panel border border-gold rounded-[12px] text-cream font-body text-sm font-bold flex items-center justify-center hover:bg-elevated hover:text-goldLight active:scale-95 transition-all duration-150 focus:outline-none" id="profile-topup-button" type="button">
        Top Up
      </button>
</section>
<!-- 4. Transactions section -->
<section class="flex flex-col space-y-3 pt-2">
<h2 class="font-fraunces text-[20px] text-cream leading-tight">All transactions</h2>
<div class="flex flex-col space-y-3" id="profile-transactions">
<!-- Card one -->
<article class="bg-panel border border-hairline rounded-[16px] p-4 flex flex-col space-y-3">
<div class="flex items-baseline justify-between">
<span class="font-body font-bold text-cream text-[15px]">Souvenir reading</span>
<span class="font-mono text-[14px] text-goldLight">+39 Cr</span>
</div>
<div class="font-body text-xs text-muted">
            US$0.99 · 30 October 2026 · paid
          </div>
<div class="flex items-center space-x-2 pt-1">
<button class="h-[38px] px-3.5 bg-panel border border-hairline rounded-[12px] text-cream font-body text-xs font-semibold hover:border-gold active:scale-95 transition-all duration-150 focus:outline-none" id="profile-souvenir-atelier-1" type="button">
              Open your atelier
            </button>
<button class="h-[38px] px-3.5 bg-panel border border-hairline rounded-[12px] text-cream font-body text-xs font-semibold hover:border-gold active:scale-95 transition-all duration-150 focus:outline-none" id="profile-souvenir-pdf-1" type="button">
              Souvenir PDF
            </button>
</div>
</article>
<!-- Card two -->
<article class="bg-panel border border-hairline rounded-[16px] p-4 flex flex-col space-y-2">
<div class="flex items-baseline justify-between">
<span class="font-body font-bold text-cream text-[15px]">Exploration credits</span>
<span class="font-mono text-[14px] text-goldLight">+40 Cr</span>
</div>
<div class="font-body text-xs text-muted">
            US$0.99 · 28 October 2026 · paid
          </div>
</article>
</div>
</section>
<!-- 5. One small muted line -->
<div class="pt-1">
<p class="font-body text-xs text-muted">Every purchase on your account.</p>
</div>
<!-- 6. Restore purchases ghost link -->
<div>
<a class="font-body text-sm text-cream underline underline-offset-4 hover:text-goldLight transition-colors duration-150 inline-block py-1" href="#" id="profile-restore-link">
        Restore purchases
      </a>
</div>
<!-- 7. Two full-width list rows with chevron -->
<section class="flex flex-col space-y-2 pt-1">
<a class="h-[52px] w-full bg-panel border border-hairline rounded-[16px] px-4 flex items-center justify-between text-cream font-body text-[15px] hover:border-gold active:scale-[0.99] transition-all duration-150" href="#" id="profile-settings-link">
<span>Settings</span>
<span class="material-symbols-outlined text-muted text-[20px]" data-icon="chevron_right">chevron_right</span>
</a>
<a class="h-[52px] w-full bg-panel border border-hairline rounded-[16px] px-4 flex items-center justify-between text-cream font-body text-[15px] hover:border-gold active:scale-[0.99] transition-all duration-150" href="#" id="profile-about-link">
<span>About Natally</span>
<span class="material-symbols-outlined text-muted text-[20px]" data-icon="chevron_right">chevron_right</span>
</a>
</section>
<!-- 8. Bottom full-width secondary button -->
<div class="pt-2">
<button class="h-[52px] w-full bg-panel border border-hairline rounded-[12px] text-cream font-body text-[15px] font-bold flex items-center justify-center hover:border-gold active:scale-[0.99] transition-all duration-150 focus:outline-none" id="profile-signout-button" type="button">
        Sign out
      </button>
</div>
</main>
<!-- 9. Version badge fixed bottom right -->
<aside class="fixed bottom-3 right-3 z-50 pointer-events-none">
<div class="bg-deepGround border border-hairline px-2.5 py-1 rounded-[6px]">
<span class="font-mono text-xs text-goldLight tracking-tight">v3.1.00001</span>
</div>
</aside>
</body></html>
