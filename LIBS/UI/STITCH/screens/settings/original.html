<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <!-- Google Fonts: Fraunces, Cinzel, Nunito Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --canvas: #120c1c;
      --panel: #1a1226;
      --elevated: #2a1d3d;
      --hairline: #3a2d50;
      --cream: #f1e8d8;
      --muted: #a698b5;
      --gold: #c9a24a;
      --error: #ffb4ab;
    }

    body {
      background-color: var(--canvas);
      color: var(--cream);
      font-family: 'Nunito Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .font-fraunces {
      font-family: 'Fraunces', serif;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Range slider styling */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      background: #c9a24a;
      height: 4px;
      border-radius: 2px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      margin-top: -6px;
      background-color: #f1e8d8;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      border: 2px solid #1a1226;
    }

    input[type=range]::-moz-range-track {
      background: #c9a24a;
      height: 4px;
      border-radius: 2px;
    }

    input[type=range]::-moz-range-thumb {
      background-color: #f1e8d8;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      border: 2px solid #1a1226;
    }
  </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between selection:bg-[#c9a24a] selection:text-[#120c1c]">

  <!-- Main Container: 20px side margins -->
  <main class="w-full max-w-[430px] mx-auto px-5 pt-7 pb-20 box-border">

    <!-- 1. Header row -->
    <header class="flex items-center justify-between mb-8">
      <h1 class="font-fraunces text-[28px] font-normal tracking-tight text-[#f1e8d8] m-0">Settings</h1>
      <button 
        id="settings-close-button" 
        type="button"
        class="font-cinzel tracking-widest text-xs uppercase text-[#f1e8d8] min-h-[44px] px-3 flex items-center justify-center bg-transparent border-none cursor-pointer hover:text-[#c9a24a] transition-colors focus:outline-none"
      >
        CLOSE
      </button>
    </header>

    <!-- 2. Five sections -->
    <div class="space-y-6">

      <!-- SECTION: SOUND -->
      <section>
        <div class="font-cinzel text-xs font-semibold tracking-[0.2em] text-[#c9a24a] uppercase mb-2 px-1">
          SOUND
        </div>
        <div class="bg-[#1a1226] border border-[#3a2d50] rounded-[16px] overflow-hidden">
          
          <!-- Row 1: Read aloud -->
          <div class="h-[52px] px-4 flex items-center justify-between border-b border-[#3a2d50]">
            <span class="text-sm font-normal text-[#f1e8d8]">Read aloud</span>
            <!-- Toggle: On (gold track with dark knob) -->
            <button 
              id="settings-read-aloud-toggle" 
              type="button" 
              role="switch" 
              aria-checked="true"
              class="w-[44px] h-[24px] rounded-full bg-[#c9a24a] relative p-[2px] flex items-center justify-end cursor-pointer focus:outline-none"
            >
              <span class="w-[20px] h-[20px] rounded-full bg-[#120c1c] block"></span>
            </button>
          </div>

          <!-- Row 2: Room sounds -->
          <div class="h-[52px] px-4 flex items-center justify-between border-b border-[#3a2d50]">
            <span class="text-sm font-normal text-[#f1e8d8]">Room sounds</span>
            <!-- Toggle: On (gold track with dark knob) -->
            <button 
              id="settings-room-sounds-toggle" 
              type="button" 
              role="switch" 
              aria-checked="true"
              class="w-[44px] h-[24px] rounded-full bg-[#c9a24a] relative p-[2px] flex items-center justify-end cursor-pointer focus:outline-none"
            >
              <span class="w-[20px] h-[20px] rounded-full bg-[#120c1c] block"></span>
            </button>
          </div>

          <!-- Row 3: Room sound volume -->
          <div class="h-[52px] px-4 flex items-center justify-between border-b border-[#3a2d50]">
            <span class="text-sm font-normal text-[#f1e8d8] pr-4 whitespace-nowrap">Room sound volume</span>
            <div class="w-32 flex items-center">
              <input 
                id="settings-room-volume-slider" 
                type="range" 
                min="0" 
                max="100" 
                value="70"
                aria-label="Room sound volume"
                class="w-full"
              >
            </div>
          </div>

          <!-- Row 4: Re-tune her voice to this device -->
          <button 
            id="settings-retune-voice-button" 
            type="button"
            class="w-full h-[52px] px-4 flex items-center justify-between bg-transparent border-none text-left cursor-pointer hover:bg-[#2a1d3d]/50 transition-colors focus:outline-none"
          >
            <span class="text-sm font-normal text-[#f1e8d8]">Re-tune her voice to this device</span>
            <svg class="w-4 h-4 text-[#a698b5] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

        </div>
      </section>

      <!-- SECTION: CHART -->
      <section>
        <div class="font-cinzel text-xs font-semibold tracking-[0.2em] text-[#c9a24a] uppercase mb-2 px-1">
          CHART
        </div>
        <div class="bg-[#1a1226] border border-[#3a2d50] rounded-[16px] overflow-hidden">
          
          <!-- Row 1: House system -->
          <div class="h-[52px] px-4 flex items-center justify-between">
            <label for="settings-house-system-select" class="text-sm font-normal text-[#f1e8d8]">House system</label>
            <div class="relative flex items-center">
              <select 
                id="settings-house-system-select" 
                class="appearance-none bg-transparent text-[#f1e8d8] text-sm pr-6 pl-2 py-1 text-right border-none cursor-pointer focus:outline-none"
              >
                <option value="Placidus" class="bg-[#1a1226] text-[#f1e8d8]">Placidus</option>
              </select>
              <svg class="w-4 h-4 text-[#a698b5] pointer-events-none absolute right-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>

        </div>
      </section>

      <!-- SECTION: MOTION -->
      <section>
        <div class="font-cinzel text-xs font-semibold tracking-[0.2em] text-[#c9a24a] uppercase mb-2 px-1">
          MOTION
        </div>
        <div class="bg-[#1a1226] border border-[#3a2d50] rounded-[16px] overflow-hidden">
          
          <!-- Row 1: Pause motion -->
          <div class="h-[52px] px-4 flex items-center justify-between">
            <span class="text-sm font-normal text-[#f1e8d8]">Pause motion</span>
            <!-- Toggle: Off (elevated track with muted knob) -->
            <button 
              id="settings-pause-motion-toggle" 
              type="button" 
              role="switch" 
              aria-checked="false"
              class="w-[44px] h-[24px] rounded-full bg-[#2a1d3d] relative p-[2px] flex items-center justify-start cursor-pointer focus:outline-none"
            >
              <span class="w-[20px] h-[20px] rounded-full bg-[#a698b5] block"></span>
            </button>
          </div>

        </div>
      </section>

      <!-- SECTION: PRIVACY -->
      <section>
        <div class="font-cinzel text-xs font-semibold tracking-[0.2em] text-[#c9a24a] uppercase mb-2 px-1">
          PRIVACY
        </div>
        <div class="bg-[#1a1226] border border-[#3a2d50] rounded-[16px] overflow-hidden">
          
          <!-- Row 1: Share anonymous usage to improve Natally -->
          <div class="h-[52px] px-4 flex items-center justify-between border-b border-[#3a2d50]">
            <span class="text-sm font-normal text-[#f1e8d8] pr-2">Share anonymous usage to improve Natally</span>
            <!-- Toggle: On (gold track with dark knob) -->
            <button 
              id="settings-analytics-toggle" 
              type="button" 
              role="switch" 
              aria-checked="true"
              class="w-[44px] h-[24px] rounded-full bg-[#c9a24a] relative p-[2px] flex items-center justify-end cursor-pointer shrink-0 focus:outline-none"
            >
              <span class="w-[20px] h-[20px] rounded-full bg-[#120c1c] block"></span>
            </button>
          </div>

          <!-- Row 2: Erase my conversation history -->
          <button 
            id="settings-erase-history-button" 
            type="button"
            class="w-full h-[52px] px-4 flex items-center justify-between bg-transparent border-none text-left cursor-pointer hover:bg-[#2a1d3d]/50 transition-colors focus:outline-none"
          >
            <span class="text-sm font-normal text-[#ffb4ab]">Erase my conversation history</span>
            <svg class="w-4 h-4 text-[#a698b5] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

        </div>
      </section>

      <!-- SECTION: ACCOUNT -->
      <section>
        <div class="font-cinzel text-xs font-semibold tracking-[0.2em] text-[#c9a24a] uppercase mb-2 px-1">
          ACCOUNT
        </div>
        <div class="bg-[#1a1226] border border-[#3a2d50] rounded-[16px] overflow-hidden">
          
          <!-- Row 1: Profile -->
          <button 
            id="settings-profile-link" 
            type="button"
            class="w-full h-[52px] px-4 flex items-center justify-between bg-transparent border-none text-left cursor-pointer hover:bg-[#2a1d3d]/50 transition-colors border-b border-[#3a2d50] focus:outline-none"
          >
            <span class="text-sm font-normal text-[#f1e8d8]">Profile</span>
            <svg class="w-4 h-4 text-[#a698b5] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

          <!-- Row 2: About Natally -->
          <button 
            id="settings-about-link" 
            type="button"
            class="w-full h-[52px] px-4 flex items-center justify-between bg-transparent border-none text-left cursor-pointer hover:bg-[#2a1d3d]/50 transition-colors focus:outline-none"
          >
            <span class="text-sm font-normal text-[#f1e8d8]">About Natally</span>
            <svg class="w-4 h-4 text-[#a698b5] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

        </div>
      </section>

    </div>

  </main>

  <!-- Fixed bottom right: version badge -->
  <div class="fixed bottom-3 right-3 z-50 pointer-events-none">
    <span class="font-mono text-[11px] leading-none px-2 py-1 rounded bg-[#0b0712] text-[#f2ca50] border border-[#3a2d50]/60">
      v3.1.00001
    </span>
  </div>

</body>
</html>
